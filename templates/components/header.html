  <header>
    <div class="header-main">
      <div class="header-title-group">
        <h1>{{title}}</h1>
        <p>{{subtitle}}</p>
      </div>

      <div class="header-actions">
        <div class="header-link">
          <ul>
            {% for link in links %}
              <li><a href="{{ link.href }}">{{ link.text }}</a></li>
            {% endfor %}
          </ul>
        </div>

        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
          <span class="theme-icon" aria-hidden="true">☾</span>
        </button>
      </div>
    </div>
  </header>

  <script>
    (() => {
      const storageKey = "myledger-theme";
      const themeToggle = document.getElementById("theme-toggle");
      const themeIcon = themeToggle ? themeToggle.querySelector(".theme-icon") : null;

      const getStoredTheme = () => {
        try {
          return localStorage.getItem(storageKey) || "light";
        } catch (error) {
          return "light";
        }
      };

      const applyTheme = (theme) => {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.body.dataset.theme = nextTheme;

        if (themeIcon) {
          themeIcon.textContent = nextTheme === "dark" ? "☀" : "☾";
        }

        if (themeToggle) {
          themeToggle.setAttribute("aria-label", nextTheme === "dark" ? "Switch to light mode" : "Switch to dark mode");
          themeToggle.title = nextTheme === "dark" ? "Switch to light mode" : "Switch to dark mode";
        }
      };

      const toggleTheme = () => {
        const currentTheme = document.body.dataset.theme === "dark" ? "dark" : "light";
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        try {
          localStorage.setItem(storageKey, nextTheme);
        } catch (error) {
          // Ignore storage access errors and fall back to the current browser preference.
        }
        applyTheme(nextTheme);
      };

      const initialTheme = getStoredTheme();
      applyTheme(initialTheme);

      if (themeToggle) {
        themeToggle.addEventListener("click", toggleTheme);
      }
    })();
  </script>
